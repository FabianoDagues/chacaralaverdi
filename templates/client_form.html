{% extends 'base.html' %}{% block title %}{{ 'Editar' if client else 'Novo' }} cliente{% endblock %}{% block content %}<div class="page-head"><h1>{{ 'Editar cliente' if client else 'Novo cliente' }}</h1><a href="/admin/clientes" class="btn secondary">Voltar</a></div><form method="post" class="panel form-grid two-cols"><label>Razão social / Nome<input name="company_name" value="{{ client.company_name if client else '' }}" required></label><label>Nome fantasia<input name="trade_name" value="{{ client.trade_name if client and client.trade_name else '' }}"></label><label>CPF/CNPJ<input name="document" value="{{ client.document if client and client.document else '' }}"></label><label>Contato<input name="contact_name" value="{{ client.contact_name if client and client.contact_name else '' }}"></label><label>E-mail de login<input type="email" name="email" value="{{ client.email if client else '' }}" required></label><label>{{ 'Nova senha (deixe em branco para manter)' if client else 'Senha inicial' }}<input type="password" name="password" {% if not client %}required minlength="8"{% endif %}></label><label>Telefone<input name="phone" value="{{ client.phone if client and client.phone else '' }}"></label><label>WhatsApp<input name="whatsapp" value="{{ client.whatsapp if client and client.whatsapp else '' }}" placeholder="44 99999-9999"></label><label class="span-2">Endereço<input name="address" value="{{ client.address if client and client.address else '' }}"></label><label>Cidade<input name="city" value="{{ client.city if client and client.city else '' }}"></label><label>UF<input name="state" maxlength="2" value="{{ client.state if client and client.state else 'PR' }}"></label><label>CEP<input name="zip_code" value="{{ client.zip_code if client and client.zip_code else '' }}"></label><label>Prazo de pagamento (dias)<input type="number" min="0" name="payment_terms_days" value="{{ client.payment_terms_days if client else 7 }}"></label><label>Limite de crédito<input name="credit_limit" value="{{ client.credit_limit if client and client.credit_limit is not none else '' }}" placeholder="opcional"></label><label class="check"><input type="checkbox" name="is_active" {% if not client or client.is_active %}checked{% endif %}> Cliente ativo</label><label class="check"><input type="checkbox" name="reminder_enabled" {% if not client or client.reminder_enabled %}checked{% endif %}> Receber lembretes de pedido no WhatsApp</label><label class="check"><input type="checkbox" name="manual_blocked" {% if client and client.manual_blocked %}checked{% endif %}> Bloquear pedidos manualmente</label><label class="span-2">Motivo do bloqueio<input name="blocked_reason" value="{{ client.blocked_reason if client and client.blocked_reason else '' }}"></label><div class="form-actions"><button class="btn primary">Salvar cliente</button></div></form>{% endblock %}
