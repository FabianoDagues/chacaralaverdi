{% extends 'base.html' %}{% block title %}{{ 'Editar' if product else 'Novo' }} produto{% endblock %}{% block content %}<div class="page-head"><h1>{{ 'Editar produto' if product else 'Novo produto' }}</h1><a href="/admin/produtos" class="btn secondary">Voltar</a></div><form method="post" class="panel form-grid two-cols"><label>Código<input name="code" value="{{ product.code if product else '' }}" required></label><label>Nome<input name="name" value="{{ product.name if product else '' }}" required></label><label>Categoria<input name="category" value="{{ product.category if product and product.category else '' }}"></label><label>Unidade<input name="unit" value="{{ product.unit if product else 'UN' }}" required placeholder="UN, KG, MAÇO, CX"></label><label>Preço padrão<input name="default_price" inputmode="decimal" value="{{ product.default_price if product else '' }}" required></label><label class="check"><input type="checkbox" name="is_active" {% if not product or product.is_active %}checked{% endif %}> Produto ativo</label><div class="form-actions"><button class="btn primary">Salvar produto</button></div></form>{% endblock %}
