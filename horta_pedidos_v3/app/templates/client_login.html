{% extends 'base.html' %}{% block title %}Login do cliente{% endblock %}
{% block content %}{% if company and company.logo_data %}<div class="login-logo"><img src="/empresa/logo" alt="Logo da empresa"></div>{% endif %}<div class="auth-card"><h1>Faça seu pedido</h1><form method="post"><label>E-mail<input type="email" name="email" required autofocus></label><label>Senha<input type="password" name="password" required></label><button class="btn primary full">Entrar</button></form><p class="center"><a href="/cliente/esqueci-senha">Esqueceu a senha?</a></p><button type="button" class="btn secondary full" data-install-app hidden onclick="installHortaApp()">Instalar no dispositivo</button><p class="muted center">No iPhone/iPad: Compartilhar → Adicionar à Tela de Início.</p><p class="muted center"><a href="/login">Acesso do operador</a></p></div>{% endblock %}
