{% extends 'base.html' %}{% block title %}Operador{% endblock %}{% block content %}<div class="page-head"><h1>{{ 'Editar operador' if user else 'Novo operador' }}</h1><a class="btn secondary" href="/admin/usuarios">Voltar</a></div><form method="post" class="panel form-grid two-cols"><label>Nome<input name="name" value="{{ user.name if user else '' }}" required></label><label>E-mail<input type="email" name="email" value="{{ user.email if user else '' }}" required></label><label>{{ 'Nova senha (opcional)' if user else 'Senha inicial' }}<input type="password" name="password" {% if not user %}required minlength="8"{% endif %}></label><label>Perfil<select name="role"><option value="OPERADOR" {% if not user or user.role=='OPERADOR' %}selected{% endif %}>OPERADOR</option><option value="ADMIN" {% if user and user.role=='ADMIN' %}selected{% endif %}>ADMIN</option></select></label><label class="check"><input type="checkbox" name="is_active" {% if not user or user.is_active %}checked{% endif %}> Usuário ativo</label><div class="form-actions"><button class="btn primary">Salvar operador</button></div></form>{% endblock %}
