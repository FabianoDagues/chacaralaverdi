{% extends 'base.html' %}{% block title %}Nova senha{% endblock %}
{% block content %}<div class="auth-card"><h1>Nova senha</h1>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}{% if valid %}<form method="post"><input type="hidden" name="token" value="{{ token }}"><label>Nova senha<input type="password" name="password" minlength="8" required></label><label>Confirme a senha<input type="password" name="password2" minlength="8" required></label><button class="btn primary full">Salvar nova senha</button></form>{% else %}<div class="alert error">Este link é inválido ou expirou.</div><a class="btn secondary full" href="/cliente/esqueci-senha">Solicitar outro link</a>{% endif %}</div>{% endblock %}
